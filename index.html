<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Juego interactivo sobre los parques nacionales del NOA argentino.">
<title>Reto NOA · Parques nacionales</title>
<style>
:root{--ink:#173530;--green:#0e756d;--green2:#194b43;--cream:#f6f2e8;--paper:#fffdf8;--orange:#e4784d;--gold:#f1bb56;--muted:#6c7b73;--line: #dddddd;--shadow:0 18px 50px rgba(23,53,48,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button{font:inherit} .wrap{width:min(980px,calc(100% - 32px));margin:auto}
.topbar{padding:18px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.05em;text-transform:uppercase;font-size:.78rem;color:var(--green)}.score{font-weight:850;color:var(--muted);font-size:.9rem}.game{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:20px 0 50px}.screen{width:min(720px,100%);background:var(--paper);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);overflow:hidden}.screen-inner{padding:38px clamp(22px,6vw,58px)}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}h1,h2{font-family:Georgia,serif;line-height:1.02;letter-spacing:-.04em;margin:12px 0 18px}h1{font-size:clamp(2.7rem,8vw,5.7rem)}h2{font-size:clamp(2rem,5vw,3.4rem)}.lead{font-size:1.08rem;color:var(--muted);max-width:590px}.intro-art{height:170px;background:linear-gradient(90deg,rgba(14,66,59,.86),rgba(14,66,59,.15)),url('assets/calilegua.jpg') center/cover;margin:-38px -58px 34px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.btn{border:0;border-radius:999px;padding:13px 20px;background:var(--green);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 8px 18px rgba(14,117,109,.18);transition:transform .2s,background .2s}.btn:hover{transform:translateY(-2px);background:var(--green2)}.btn.secondary{background:transparent;color:var(--green);border:1px solid var(--green);box-shadow:none}.btn.orange{background:var(--orange)}.btn.small{padding:9px 13px;font-size:.84rem}.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.no-zone{position:relative;min-height:110px;margin-top:14px;border-radius:20px;background:#f4ead8;overflow:hidden;padding:16px}.no-zone .btn{position:absolute;left:18px;top:16px}.hint{font-size:.82rem;color:var(--muted);margin:0}.progress-row{display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--muted);font-size:.85rem;font-weight:800}.progress{height:10px;background:#ebe5d8;border-radius:99px;overflow:hidden;margin:10px 0 26px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--orange));border-radius:inherit;transition:width .3s}.question-tag{display:inline-flex;gap:8px;align-items:center;background:#e7f0e8;color:var(--green);border-radius:999px;padding:7px 11px;font-size:.82rem;font-weight:850}.question{font-family:Georgia,serif;font-size:clamp(1.75rem,4vw,2.7rem);line-height:1.1;margin:18px 0 22px}.options{display:grid;gap:12px}.option{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px 16px;cursor:pointer;color:var(--ink);font-weight:800;transition:.2s}.option:hover{border-color:var(--green);transform:translateX(3px);background:#f3f8f3}.letter{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e7f0e8;color:var(--green);flex:none}.option:disabled{cursor:default;opacity:.92}.option.correct{border-color:#30966d;background:#e4f5e9;color:#176044}.option.wrong{border-color:#d86e58;background:#fff0eb;color:#9c412d}.answer{margin-top:22px;border-radius:22px;overflow:hidden;background:#edf2ea;border:1px solid #d4e0d3}.answer img{width:100%;height:190px;object-fit:cover;display:block}.answer-copy{padding:19px}.answer-copy h3{font-family:Georgia,serif;font-size:1.55rem;margin:0 0 7px}.answer-copy p{margin:0 0 14px;color:var(--muted)}.link-row{display:flex;flex-wrap:wrap;gap:9px}.hidden{display:none!important}.final{text-align:center}.final-badge{font-size:4rem;margin:2px 0 12px}.score-big{font-family:Georgia,serif;font-size:4rem;color:var(--orange);line-height:1;margin:15px}.mini-note{font-size:.86rem;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.76rem;padding:14px}
@media(max-width:560px){.wrap{width:min(100% - 18px,980px)}.screen-inner{padding:27px 19px}.intro-art{margin:-27px -19px 27px;height:145px}.topbar{padding:12px 0}.game{padding-top:4px}.answer img{height:160px}}
</style>
<style id="lf-tema">html,body{background:#ffffff !important;color:#1a1a1a !important;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important;font-size:16px !important}</style></head>
<body>
<div class="wrap topbar"><div class="brand">Reto NOA · naturaleza argentina</div><div class="score" id="scoreTop"></div></div>
<main class="wrap game"><section class="screen" id="app"></section></main>
<footer>Juego educativo sobre los parques nacionales del Noroeste argentino.</footer>
<script>
const parks={
 Calilegua:{province:'Jujuy',image:'assets/calilegua.jpg',official:'https://www.argentina.gob.ar/parquesnacionales/region-noroeste/parque-nacional-calilegua'},
 Baritú:{province:'Salta',image:'assets/baritu.jpg',official:'https://www.argentina.gob.ar/parquesnacionales/region-noroeste/parque-nacional-baritu'},
 'El Rey':{province:'Salta',image:'assets/el-rey.jpg',official:'https://www.argentina.gob.ar/parquesnacionales/region-noroeste/parque-nacional-el-rey'},
 Copo:{province:'Santiago del Estero',image:'assets/copo.jpg',official:'https://www.argentina.gob.ar/parquesnacionales/region-noroeste/parque-nacional-copo'},
 Aconquija:{province:'Tucumán',image:'assets/aconquija.jpg',official:'https://www.argentina.gob.ar/parquesnacionales/region-noroeste/parque-nacional-aconquija'},
 'Los Cardones':{province:'Salta',image:'assets/los-cardones.jpg',official:'https://www.argentina.gob.ar/parquesnacionales/region-noroeste/parque-nacional-los-cardones'}
};
const questions=[
 {q:'¿En qué parque nacional del NOA aparecen selvas de Yungas con jacarandás, tipas y cedros coya?',correct:'Calilegua',wrong:['Plaza de Mayo','Estadio Mario Alberto Kempes']},
 {q:'¿Dónde se encuentra una de las grandes reservas de bosque chaqueño seco con quebracho colorado santiagueño?',correct:'Copo',wrong:['Monumento a la Bandera','Plaza San Martín de Mendoza']},
 {q:'¿Qué parque protege ambientes de Yungas y Chaco Seco en una transición de gran biodiversidad?',correct:'El Rey',wrong:['Estadio Monumental','Obelisco de Buenos Aires']},
 {q:'¿Qué parque combina Yungas y Altos Andes, con aliso del cerro, pino del cerro y taruca?',correct:'Aconquija',wrong:['Teatro Colón','Puente de la Mujer']},
 {q:'¿En qué parque se destacan los cardonales de los Valles Calchaquíes?',correct:'Los Cardones',wrong:['Plaza Independencia de Mendoza','Estadio Libertadores de América']},
 {q:'¿Qué parque de Salta es una de las áreas más aisladas y húmedas de las Yungas argentinas?',correct:'Baritú',wrong:['Basílica de Luján','Parque Lezama']},
 {q:'¿Cuál es el parque jujeño cuyo acceso principal continúa por la RP 83 desde Libertador General San Martín?',correct:'Calilegua',wrong:['Monumento a Güemes','Estadio Gigante de Arroyito']},
 {q:'¿En qué parque vive el chancho quimilero, uno de los mamíferos emblemáticos del Chaco Seco?',correct:'Copo',wrong:['Plaza de los Dos Congresos','Monumento a la Cordialidad']},
 {q:'¿Dónde se encuentra el sendero interpretativo Munakuy?',correct:'Copo',wrong:['Estadio José Amalfitani','Plaza Moreno de La Plata']},
 {q:'¿Qué parque tiene como acceso de referencia la Seccional Martín Miguel de Güemes?',correct:'El Rey',wrong:['Monumento Histórico Nacional a la Bandera','Estadio Malvinas Argentinas']},
 {q:'¿En qué parque el yasto o carpintero de las piedras es un ave emblemática?',correct:'Los Cardones',wrong:['Plaza de Mayo','Monumento a los Caídos en Malvinas']},
 {q:'¿Dónde se protegen ambientes de altura con yareta y pastizales altoandinos?',correct:'Aconquija',wrong:['Estadio Ciudad de La Plata','Parque Centenario']},
 {q:'¿Qué parque nacional es conocido por sus lluvias abundantes y selvas montanas de Baritú?',correct:'Baritú',wrong:['Monumento a Sarmiento','Estadio Único Madre de Ciudades']},
 {q:'¿En qué parque se encuentra el cardón o pasacana como símbolo del paisaje?',correct:'Los Cardones',wrong:['Plaza Dorrego','Monumento a la Independencia']},
 {q:'¿Dónde se pueden encontrar especies como el tapir, la corzuela y el lobito de río en ambientes de Yungas y Chaco?',correct:'El Rey',wrong:['Estadio Alberto J. Armando','Plaza España de Córdoba']},
 {q:'¿Cuál es el parque asociado a la protección del yaguareté en las Yungas salteñas?',correct:'Baritú',wrong:['Monumento a Fangio','Plaza 25 de Mayo de Rosario'],special:'yaguarete'},
 {q:'¿En qué parque la taruca es una de las especies destacadas junto al guanaco y el gato andino?',correct:'Aconquija',wrong:['Estadio Tomás Adolfo Ducó','Monumento a la Bandera']},
 {q:'¿Qué parque nacional presenta un clima árido, lluvias escasas y grandes cardonales?',correct:'Los Cardones',wrong:['Plaza Alvear','Estadio Diego Armando Maradona']}
];
let index=0,score=0,answered=false,noMoves=0;
const app=document.querySelector('#app'),scoreTop=document.querySelector('#scoreTop');
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function intro(){app.innerHTML=`<div class="intro-art"></div><div class="screen-inner"><div class="eyebrow">Juego interactivo</div><h1>¿Conocés los parques nacionales del NOA?</h1><p class="lead">Poné a prueba cuánto sabés sobre la naturaleza de Jujuy, Salta, Tucumán y Santiago del Estero.</p><div class="actions"><button class="btn" id="yes">Sí, quiero jugar</button></div><div class="no-zone" id="noZone"><p class="hint">¿Seguro que no querés intentarlo?</p><button class="btn secondary" id="no">No</button></div></div>`;scoreTop.textContent='';document.querySelector('#yes').onclick=start;const no=document.querySelector('#no');const zone=document.querySelector('#noZone');function escapeNo(){const maxX=Math.max(12,zone.clientWidth-no.offsetWidth-12),maxY=Math.max(45,zone.clientHeight-no.offsetHeight-8);no.style.left=(12+Math.random()*Math.max(0,maxX-12))+'px';no.style.top=(38+Math.random()*Math.max(0,maxY-38))+'px';noMoves++;if(noMoves>=4)no.textContent='¡Casi!';}['mouseenter','pointerdown','touchstart','focus'].forEach(e=>no.addEventListener(e,ev=>{ev.preventDefault();escapeNo()}));}
function start(){index=0;score=0;answered=false;showQuestion();}
function showQuestion(){answered=false;const p=questions[index],pct=(index/questions.length)*100;scoreTop.textContent=`Puntaje: ${score}/${index}`;app.innerHTML=`<div class="screen-inner"><div class="progress-row"><span>Pregunta ${index+1} de ${questions.length}</span><span>${score} correctas</span></div><div class="progress"><span style="width:${pct}%"></span></div><span class="question-tag">Explorá el NOA</span><div class="question">${esc(p.q)}</div><div class="options">${[p.correct,...p.wrong].sort(()=>Math.random()-.5).map((x,i)=>`<button class="option" data-answer="${esc(x)}"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(x)}</button>`).join('')}</div><div id="feedback"></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b,p));}
function answer(btn,p){if(answered)return;answered=true;const ok=btn.dataset.answer===p.correct;if(ok)score++;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.answer===p.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');});const park=parks[p.correct];const feedback=document.querySelector('#feedback');const special=p.special==='yaguarete'?`<a class="btn orange small" href="https://www.instagram.com/redyaguarete/" target="_blank" rel="noopener">Ver Red Yaguareté ↗</a>`:'';feedback.innerHTML=`<div class="answer"><img src="${park.image}" alt="Paisaje del Parque Nacional ${esc(p.correct)}"><div class="answer-copy"><h3>${ok?'¡Respuesta correcta!':'La respuesta era '+esc(p.correct)}</h3><p>${ok?'Muy bien.':'No pasa nada: cada respuesta ayuda a conocer mejor el NOA.'} El Parque Nacional ${esc(p.correct)} está en ${esc(park.province)}.</p><div class="link-row"><a class="btn small" href="${park.official}" target="_blank" rel="noopener">Información oficial ↗</a>${special}<button class="btn secondary small" id="next">${index===questions.length-1?'Ver resultado':'Siguiente pregunta'}</button></div></div></div>`;document.querySelector('#next').onclick=()=>index===questions.length-1?finish():((index++),showQuestion());scoreTop.textContent=`Puntaje: ${score}/${index+1}`;}
function finish(){scoreTop.textContent=`Resultado: ${score}/${questions.length}`;const msg=score>=15?'¡Explorador experto del NOA!':score>=10?'¡Muy buen recorrido!':'¡Buen comienzo! Ahora podés volver a recorrer los parques.';app.innerHTML=`<div class="screen-inner final"><div class="final-badge">🌿</div><div class="eyebrow">Recorrido terminado</div><h2>${msg}</h2><div class="score-big">${score}/${questions.length}</div><p class="lead">Cada parque protege paisajes y especies únicas. Volvé a jugar para mejorar tu puntaje.</p><div class="actions" style="justify-content:center"><button class="btn" id="again">Jugar de nuevo</button><a class="btn secondary" href="https://www.argentina.gob.ar/parquesnacionales" target="_blank" rel="noopener">Conocer Parques Nacionales ↗</a></div></div>`;document.querySelector('#again').onclick=intro;}
intro();
</script>
</body>
</html>
